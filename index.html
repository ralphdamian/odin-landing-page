<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Landing Page</title>
</head>
<body>
    <div class="header">
        <nav>
            <div class="left-nav">
                <div class="logo">
                    Header Logo
                </div>
            </div>
            <ul>
                <li>header link one</li>
                <li>header link two</li>
                <li>header link three</li>
            </ul>
        </nav>   
    </div>
    <div class="body">
        <div class="cards">   
            <figure>
                <img src="" alt="">
                <figcaption>This is some subtext under an illustration or image</figcaption>
            </figure>
            <figure>
                <img src="" alt="">
                <figcaption>This is some subtext under an illustration or image</figcaption>
            </figure>
            <figure>
                <img src="" alt="">
                <figcaption>This is some subtext under an illustration or image</figcaption>
            </figure>
            <figure>
                <img src="" alt="">
                <figcaption>This is some subtext under an illustration or image</figcaption>
            </figure>    
        </div>
        <div class="quoterow">
            <figure class="quote">
                <blockquote>
                    <p>This is an inspiring quote, or a testimonial from a customer. Maybe it's just filling up space, or maybe people will actually read it. Who knows? All I know is that it looks nice.</p>
                </blockquote>
                <figcaption>-<cite>Thor, God of Thunder</cite></figcaption>
            </figure>
        </div>
        <div class="bannerrow">
            <div class="banner">
                <p class="bigbannertxt">Call to action! It's time!</p>
                <p class="bannertxt">Sign up for our product by clicking that button right over there!</p>
                <button>Sign up</button>
            </div>
        </div>
    </div>
    <div class="footer"></div>
